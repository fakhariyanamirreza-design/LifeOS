<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>پلنر هفتگی</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b6af0'/%3E%3Ctext x='32' y='46' font-size='36' text-anchor='middle'%3E📅%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%235b6af0'/%3E%3Ctext x='90' y='128' font-size='100' text-anchor='middle'%3E📅%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="پلنر هفتگی">
<meta name="theme-color" content="#5b6af0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:"Vazirmatn",sans-serif!important}
:root{
  --bg:#f7f8ff;
  --bg2:#ffffff;
  --bg3:#eef0fb;
  --border:rgba(91,106,240,.1);
  --border2:rgba(91,106,240,.2);
  --text:#1a1d2e;
  --text2:#565d7a;
  --text3:#9ba3c4;
  --sat:#5b6af0; --sat-bg:#eef0ff; --sat-light:#f5f6ff;
  --sun:#f97316; --sun-bg:#fff3eb; --sun-light:#fffaf6;
  --mon:#10b981; --mon-bg:#ecfdf5; --mon-light:#f5fdf9;
  --tue:#f59e0b; --tue-bg:#fffbeb; --tue-light:#fffef5;
  --wed:#3b82f6; --wed-bg:#eff6ff; --wed-light:#f7fbff;
  --thu:#8b5cf6; --thu-bg:#f5f3ff; --thu-light:#faf9ff;
  --fri:#ec4899; --fri-bg:#fdf2f8; --fri-light:#fef9fc;
  --green:#059669; --green-bg:#d1fae5;
  --red:#dc2626; --red-bg:#fee2e2;
  --amber:#d97706; --amber-bg:#fef3c7;
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sh:0 1px 3px rgba(26,29,46,.06),0 4px 12px rgba(91,106,240,.07);
  --sh2:0 8px 32px rgba(91,106,240,.15);
}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6}

/* ══ CONFIG ══ */
#cfg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,#f0f1ff,#e8eaff)}
.cfg-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-lg);padding:2.5rem;width:100%;max-width:460px;box-shadow:var(--sh2)}
.cfg-logo{font-size:1.6rem;font-weight:800;color:var(--sat);margin-bottom:.2rem}
.cfg-sub{color:var(--text2);font-size:13px;margin-bottom:2rem}
.cfg-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;display:block}
.cfg-inp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:13px;padding:10px 14px;margin-bottom:1rem;outline:none;transition:border-color .2s;direction:ltr}
.cfg-inp:focus{border-color:var(--sat);box-shadow:0 0 0 3px rgba(91,106,240,.1)}
.cfg-note{background:#eef0ff;border:1px solid rgba(91,106,240,.2);border-radius:var(--r-sm);padding:12px 14px;font-size:12px;color:var(--text2);margin-bottom:1.5rem;line-height:1.8}
.cfg-note strong{color:var(--sat)}.cfg-note a{color:var(--sat)}
.btn-main{width:100%;background:var(--sat);color:#fff;border:none;border-radius:var(--r-sm);padding:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-main:hover{background:#4a59e8;transform:translateY(-1px)}
.cfg-err{color:var(--red);font-size:12px;margin-top:10px;text-align:center;line-height:1.6}

/* ══ APP LAYOUT ══ */
#app{display:none;min-height:100vh;display:none}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:.875rem 1.5rem;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(91,106,240,.06)}
.topbar-logo{font-size:1rem;font-weight:800;color:var(--sat)}
.topbar-week{font-size:13px;font-weight:600;color:var(--text2);flex:1}
.topbar-nav{display:flex;gap:6px}
.tnav{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .15s}
.tnav:hover{border-color:var(--sat);color:var(--sat)}
.tnav.active{background:var(--sat);color:#fff;border-color:var(--sat)}
.app-body{padding:1.25rem 1.5rem}

/* ══ WEEK VIEW ══ */
.week-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap}
.week-focus-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.25rem;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start}
.week-focus-label{font-size:11px;font-weight:700;color:var(--sat);white-space:nowrap;padding-top:3px;letter-spacing:.3px}
.week-focus-input{flex:1;border:none;outline:none;font-size:14px;color:var(--text);background:transparent;resize:none;line-height:1.5;font-weight:500}
.week-focus-input::placeholder{color:var(--text3)}

/* ══ DAYS GRID ══ */
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:1.25rem}
.day-col{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--border)}
.day-col.today-col{box-shadow:var(--sh2);border-width:2px}
.day-header{padding:.625rem .75rem;text-align:center;cursor:pointer}
.day-name{font-size:12px;font-weight:700;margin-bottom:2px}
.day-date{font-size:10px;opacity:.75;font-weight:500}
.day-body{background:var(--bg2);padding:.625rem .75rem}

/* Per-day color scheme */
.day-col.d0 .day-header{background:var(--sat-bg)}.day-col.d0 .day-name{color:var(--sat)}.day-col.d0.today-col{border-color:var(--sat)}
.day-col.d1 .day-header{background:var(--sun-bg)}.day-col.d1 .day-name{color:var(--sun)}.day-col.d1.today-col{border-color:var(--sun)}
.day-col.d2 .day-header{background:var(--mon-bg)}.day-col.d2 .day-name{color:var(--mon)}.day-col.d2.today-col{border-color:var(--mon)}
.day-col.d3 .day-header{background:var(--tue-bg)}.day-col.d3 .day-name{color:var(--tue)}.day-col.d3.today-col{border-color:var(--tue)}
.day-col.d4 .day-header{background:var(--wed-bg)}.day-col.d4 .day-name{color:var(--wed)}.day-col.d4.today-col{border-color:var(--wed)}
.day-col.d5 .day-header{background:var(--thu-bg)}.day-col.d5 .day-name{color:var(--thu)}.day-col.d5.today-col{border-color:var(--thu)}
.day-col.d6 .day-header{background:var(--fri-bg)}.day-col.d6 .day-name{color:var(--fri)}.day-col.d6.today-col{border-color:var(--fri)}

/* ══ PRIORITIES ══ */
.priorities-section{margin-bottom:.75rem}
.sec-mini-label{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.priority-row{display:flex;align-items:flex-start;gap:5px;margin-bottom:3px}
.pnum{width:14px;height:14px;border-radius:50%;background:var(--sat);color:#fff;font-size:8px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.day-col.d1 .pnum{background:var(--sun)}.day-col.d2 .pnum{background:var(--mon)}.day-col.d3 .pnum{background:var(--tue)}.day-col.d4 .pnum{background:var(--wed)}.day-col.d5 .pnum{background:var(--thu)}.day-col.d6 .pnum{background:var(--fri)}
.pinput{flex:1;border:none;outline:none;font-size:10px;color:var(--text);background:transparent;resize:none;line-height:1.4;padding:0}
.pinput::placeholder{color:var(--text3)}

/* ══ EVENTS ══ */
.events-section{margin-bottom:.75rem}
.event-row{display:flex;gap:5px;align-items:flex-start;margin-bottom:4px}
.etime{font-size:9px;color:var(--text3);white-space:nowrap;padding-top:2px;min-width:28px;direction:ltr}
.etime-input{width:34px;border:none;outline:none;font-size:9px;color:var(--text2);background:transparent;padding:0;direction:ltr}
.event-input{flex:1;border:none;outline:none;font-size:10px;color:var(--text);background:transparent;resize:none;line-height:1.4;padding:0}
.event-input::placeholder{color:var(--text3)}
.add-event-btn{font-size:9px;color:var(--text3);cursor:pointer;padding:0 2px;background:none;border:none;transition:color .15s}
.add-event-btn:hover{color:var(--sat)}

/* ══ TASKS ══ */
.tasks-section{}
.task-row{display:flex;align-items:flex-start;gap:5px;margin-bottom:3px}
.tchk{width:12px;height:12px;border:1.5px solid var(--border2);border-radius:3px;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tchk.on{background:var(--green);border-color:var(--green)}
.tchk.on::after{content:"✓";font-size:7px;color:#fff;font-weight:800}
.tinput{flex:1;border:none;outline:none;font-size:10px;color:var(--text);background:transparent;resize:none;line-height:1.4;padding:0}
.tinput::placeholder{color:var(--text3)}
.tinput.done-text{text-decoration:line-through;color:var(--text3)}
.task-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;padding:0;opacity:0;transition:opacity .15s}
.task-row:hover .task-del{opacity:1}
.task-del:hover{color:var(--red)}
.add-task-btn{font-size:9px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:3px;background:none;border:none;margin-top:4px;transition:color .15s}
.add-task-btn:hover{color:var(--sat)}
.completion-bar{height:3px;background:var(--bg3);border-radius:2px;margin-top:6px;overflow:hidden}
.completion-fill{height:100%;border-radius:2px;transition:width .4s}

/* ══ LEFT PANEL (habits + weekly tasks + reminders) ══ */
.left-panel{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.panel-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;box-shadow:var(--sh)}
.panel-title{font-size:12px;font-weight:800;color:var(--text);margin-bottom:.875rem;display:flex;align-items:center;gap:6px}
.panel-title-icon{font-size:.9rem}

/* ══ HABITS TABLE ══ */
.habits-table{width:100%;border-collapse:collapse}
.habits-table th{font-size:9px;font-weight:700;color:var(--text3);text-align:center;padding:2px 4px}
.habits-table td{padding:3px 4px;text-align:center}
.habit-name-cell{text-align:right!important;font-size:10px;color:var(--text);font-weight:500;white-space:nowrap}
.habit-chk{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;font-size:9px}
.habit-chk.on{background:var(--green);border-color:var(--green);color:#fff}
.habits-score{font-size:10px;color:var(--text2);text-align:center;margin-top:.5rem;font-weight:600}
.habit-add-row{display:flex;gap:6px;margin-top:.75rem}
.habit-inp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);font-size:11px;padding:5px 8px;outline:none;color:var(--text)}
.habit-inp:focus{border-color:var(--sat)}
.btn-xs{background:var(--sat);color:#fff;border:none;border-radius:var(--r-sm);padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer}

/* ══ WEEKLY TASKS LIST ══ */
.weekly-task-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:5px}
.wtchk{width:14px;height:14px;border:1.5px solid var(--border2);border-radius:4px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:8px}
.wtchk.on{background:var(--sat);border-color:var(--sat);color:#fff}
.wt-inp{flex:1;border:none;outline:none;font-size:11px;color:var(--text);background:transparent;padding:0;line-height:1.5}
.wt-inp::placeholder{color:var(--text3)}
.wt-inp.done-text{text-decoration:line-through;color:var(--text3)}
.wt-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0;opacity:0}
.weekly-task-row:hover .wt-del{opacity:1}
.wt-del:hover{color:var(--red)}
.weekly-tasks-score{font-size:10px;color:var(--text2);margin-top:.5rem;font-weight:600}

/* ══ REMINDERS ══ */
.reminder-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rem-chk{width:14px;height:14px;border:1.5px solid var(--border2);border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:8px}
.rem-chk.on{background:var(--amber);border-color:var(--amber);color:#fff}
.rem-inp{flex:1;border:none;outline:none;font-size:11px;color:var(--text);background:transparent;padding:0}
.rem-inp::placeholder{color:var(--text3)}
.rem-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0;opacity:0}
.reminder-row:hover .rem-del{opacity:1}
.rem-del:hover{color:var(--red)}
.add-row-btn{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);cursor:pointer;background:none;border:none;margin-top:6px;transition:color .15s}
.add-row-btn:hover{color:var(--sat)}

/* ══ WEEK NAV ══ */
.btn-nav{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s}
.btn-nav:hover{border-color:var(--sat);color:var(--sat)}
.week-range-label{font-size:13px;font-weight:700;color:var(--text)}
.btn-today{background:var(--sat);color:#fff;border:none;border-radius:var(--r-sm);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-today:hover{opacity:.88}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(12px);background:#1a1d2e;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══ MOBILE ══ */
@media(max-width:900px){
  .days-grid{grid-template-columns:repeat(4,1fr)}
  .left-panel{grid-template-columns:1fr}
  .topbar-nav .tnav:not(.active){display:none}
}
@media(max-width:600px){
  .days-grid{grid-template-columns:repeat(2,1fr)}
  .app-body{padding:.875rem 1rem}
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- CONFIG -->
<div id="cfg">
  <div class="cfg-card">
    <div class="cfg-logo">📅 پلنر هفتگی</div>
    <div class="cfg-sub">نسخه دیجیتال پلنر اکسل</div>
    <div class="cfg-note">
      <strong>راه‌اندازی Supabase:</strong><br>
      ۱. به <a href="https://supabase.com" target="_blank">supabase.com</a> برو → اکانت بساز<br>
      ۲. یک Project جدید بساز → از <strong>Settings → API</strong> مقادیر را کپی کن
    </div>
    <label class="cfg-label">Supabase URL</label>
    <input class="cfg-inp" id="sb-url" placeholder="https://xxxx.supabase.co"/>
    <label class="cfg-label">Supabase Anon Key</label>
    <input class="cfg-inp" id="sb-key" placeholder="eyJhbGci..."/>
    <button class="btn-main" onclick="initSB()">🚀 شروع</button>
    <div id="cfg-err" class="cfg-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">📅 پلنر</div>
    <div class="topbar-week" id="tb-week"></div>
    <div class="topbar-nav">
      <button class="tnav active" onclick="goView('week')" id="tnav-week">هفتگی</button>
      <button class="tnav" onclick="goView('day')" id="tnav-day">روزانه</button>
    </div>
  </div>

  <div class="app-body">
    <!-- WEEK VIEW -->
    <div id="view-week">
      <div class="week-header">
        <button class="btn-nav" onclick="shiftWeek(-1)">← هفته قبل</button>
        <span class="week-range-label" id="week-range"></span>
        <button class="btn-nav" onclick="shiftWeek(1)">هفته بعد →</button>
        <button class="btn-today" onclick="gotoToday()">این هفته</button>
      </div>

      <!-- FOCUS -->
      <div class="week-focus-wrap">
        <span class="week-focus-label">تمرکز هفته</span>
        <textarea class="week-focus-input" id="week-focus" rows="2" placeholder="تمرکز اصلی این هفته چیه؟" onblur="saveWeekFocus()"></textarea>
      </div>

      <!-- 7-DAY GRID -->
      <div class="days-grid" id="days-grid"></div>

      <!-- BOTTOM PANELS -->
      <div class="left-panel">
        <!-- HABITS -->
        <div class="panel-card">
          <div class="panel-title"><span class="panel-title-icon">🏃</span>عادات هفتگی</div>
          <div id="habits-panel"></div>
        </div>
        <!-- WEEKLY TASKS + REMINDERS -->
        <div>
          <div class="panel-card" style="margin-bottom:1rem">
            <div class="panel-title"><span class="panel-title-icon">📋</span>لیست کارهای هفتگی</div>
            <div id="weekly-tasks-panel"></div>
            <button class="add-row-btn" onclick="addWeeklyTask()">+ کار جدید</button>
            <div class="weekly-tasks-score" id="wt-score"></div>
          </div>
          <div class="panel-card">
            <div class="panel-title"><span class="panel-title-icon">🔔</span>یادآوری‌ها</div>
            <div id="reminders-panel"></div>
            <button class="add-row-btn" onclick="addReminder()">+ یادآور جدید</button>
          </div>
        </div>
      </div>
    </div>

    <!-- DAY VIEW -->
    <div id="view-day" style="display:none">
      <div class="week-header">
        <button class="btn-nav" onclick="shiftDay(-1)">← دیروز</button>
        <span class="week-range-label" id="day-label"></span>
        <button class="btn-nav" onclick="shiftDay(1)">فردا →</button>
        <button class="btn-today" onclick="gotoToday()">امروز</button>
      </div>
      <div id="day-detail"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// JALALI
// ══════════════════════════════════════════════════════════
function g2j(gy,gm,gd){
  var g_dm=[31,28,31,30,31,30,31,31,30,31,30,31],j_dm=[31,31,31,31,31,31,30,30,30,30,30,29];
  gy-=1600;gm-=1;gd-=1;
  var gdn=365*gy+Math.floor((gy+3)/4)-Math.floor((gy+99)/100)+Math.floor((gy+399)/400);
  for(var i=0;i<gm;i++)gdn+=g_dm[i];
  if(gm>1&&((gy%4==0&&gy%100!=0)||(gy%400==0)))gdn++;
  gdn+=gd;
  var jdn=gdn-79,jnp=Math.floor(jdn/12053);jdn%=12053;
  var jy=979+33*jnp+4*Math.floor(jdn/1461);jdn%=1461;
  if(jdn>=366){jy+=Math.floor((jdn-1)/365);jdn=(jdn-1)%365;}
  for(var i=0;i<11&&jdn>=j_dm[i];i++)jdn-=j_dm[i];
  return[jy,i+1,jdn+1];
}
const JM=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const DAYS_FA=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنج‌شنبه","جمعه"];
const DAYS_SHORT=["ش","ی","د","س","چ","پ","ج"];
// js day: 0=sun,1=mon,...,6=sat
function jsDay2idx(d){return d===0?1:d===6?0:d;}// sat=0,sun=1,mon=2,...,fri=6
function jStr(s,f){
  if(!s)return"";
  var d=new Date(s+"T12:00"),r=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
  if(f==="full"){var idx=jsDay2idx(d.getDay());return DAYS_FA[idx]+" "+r[2]+" "+JM[r[1]-1]+" "+r[0];}
  if(f==="short")return r[2]+" "+JM[r[1]-1];
  if(f==="mini")return r[2]+"/"+r[1];
  return r[0]+"/"+(r[1]+"").padStart(2,"0")+"/"+(r[2]+"").padStart(2,"0");
}
function today(){return new Date().toISOString().split("T")[0];}

// get saturday of the week containing dateStr (week starts Saturday in Iran)
function getWeekSat(dateStr){
  var d=new Date(dateStr+"T12:00");
  var day=d.getDay(); // 0=sun,6=sat
  var diff=day===6?0:day+1; // days since saturday
  d.setDate(d.getDate()-diff);
  return d.toISOString().split("T")[0];
}
function addDays(dateStr,n){
  var d=new Date(dateStr+"T12:00");d.setDate(d.getDate()+n);
  return d.toISOString().split("T")[0];
}

// STATE
// ══════════════════════════════════════════════════════════
let sb=null;
let currentWeekSat=getWeekSat(today());
let currentDay=today();
let currentView="week";

// Data cache keyed by week_start (YYYY-MM-DD of Saturday)
let cache={
  weeks:{},      // week_start -> {focus,id}
  priorities:{}, // dateStr -> [{id,num,text}]
  events:{},     // dateStr -> [{id,time,text}]
  tasks:{},      // dateStr -> [{id,done,text}]
  habits:[],     // [{id,name}]
  habitLogs:{},  // week_start+habitId -> {id,done} per day: key="weekStart_habitId_dayIdx"
  weeklyTasks:{},// week_start -> [{id,done,text}]

// ══════════════════════════════════════════════════════════
// SUPABASE INIT
// ══════════════════════════════════════════════════════════
async function initSB(){
  var url=document.getElementById("sb-url").value.trim();
  var key=document.getElementById("sb-key").value.trim();
  if(!url||!key){setErr("لطفاً هر دو فیلد را پر کن");return;}
  try{
    sb=window.supabase.createClient(url,key);
    var{error}=await sb.from("weeks").select("id").limit(1);
    if(error&&error.code==="42P01"){showSQL();return;}
    if(error)throw error;
    localStorage.setItem("pl_url",url);localStorage.setItem("pl_key",key);
    document.getElementById("cfg").style.display="none";
    document.getElementById("app").style.display="block";
    boot();
  }catch(e){setErr("خطا: "+e.message);}
}
function setErr(m){document.getElementById("cfg-err").innerHTML=m;}
function showSQL(){
  setErr(`⚠️ جداول وجود ندارند. در <strong>Supabase → SQL Editor</strong> این SQL را اجرا کن، سپس دوباره وارد شو:<br><br><textarea style="width:100%;height:180px;font-size:9.5px;background:#0f172a;color:#7dd3fc;border:none;padding:8px;border-radius:6px;font-family:monospace;resize:none;direction:ltr;margin-top:6px">
CREATE TABLE IF NOT EXISTS weeks (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, week_start date UNIQUE NOT NULL, focus text, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS day_priorities (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, day_date date NOT NULL, num int NOT NULL, text text, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS day_events (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, day_date date NOT NULL, event_time text, text text, sort_order int DEFAULT 0, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS day_tasks (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, day_date date NOT NULL, text text, done boolean DEFAULT false, sort_order int DEFAULT 0, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS habits (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, name text NOT NULL, sort_order int DEFAULT 0, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS habit_logs (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, habit_id uuid REFERENCES habits(id) ON DELETE CASCADE, log_date date NOT NULL, done boolean DEFAULT false, UNIQUE(habit_id, log_date));
CREATE TABLE IF NOT EXISTS weekly_tasks (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, week_start date NOT NULL, text text, done boolean DEFAULT false, sort_order int DEFAULT 0, created_at timestamptz DEFAULT now());
CREATE TABLE IF NOT EXISTS reminders (id uuid DEFAULT gen_random_uuid() PRIMARY KEY, week_start date NOT NULL, text text, done boolean DEFAULT false, sort_order int DEFAULT 0, created_at timestamptz DEFAULT now());
    </textarea>`);
}

async function boot(){
  await loadHabits();
  await loadWeekData(currentWeekSat);
  renderAll();
}

// ══════════════════════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════════════════════
async function loadHabits(){
  var{data}=await sb.from("habits").select("*").order("sort_order");
  cache.habits=data||[];
}

async function loadWeekData(ws){
  var we=addDays(ws,6);
  var[r1,r2,r3,r4,r5,r6,r7]=await Promise.all([
    sb.from("weeks").select("*").eq("week_start",ws).maybeSingle(),
    sb.from("day_priorities").select("*").gte("day_date",ws).lte("day_date",we).order("num"),
    sb.from("day_events").select("*").gte("day_date",ws).lte("day_date",we).order("sort_order"),
    sb.from("day_tasks").select("*").gte("day_date",ws).lte("day_date",we).order("sort_order"),
    sb.from("habit_logs").select("*").gte("log_date",ws).lte("log_date",we),
    sb.from("weekly_tasks").select("*").eq("week_start",ws).order("sort_order"),
    sb.from("reminders").select("*").eq("week_start",ws).order("sort_order"),
  ]);
  cache.weeks[ws]=r1.data||null;
  // priorities by date
  (r2.data||[]).forEach(p=>{
    if(!cache.priorities[p.day_date])cache.priorities[p.day_date]=[];
    cache.priorities[p.day_date].push(p);
  });
  // events by date
  (r3.data||[]).forEach(e=>{
    if(!cache.events[e.day_date])cache.events[e.day_date]=[];
    cache.events[e.day_date].push(e);
  });
  // tasks by date
  (r4.data||[]).forEach(t=>{
    if(!cache.tasks[t.day_date])cache.tasks[t.day_date]=[];
    cache.tasks[t.day_date].push(t);
  });
  // habit logs
  (r5.data||[]).forEach(l=>{
    cache.habitLogs[l.habit_id+"_"+l.log_date]={id:l.id,done:l.done};
  });
  cache.weeklyTasks[ws]=r6.data||[];
  cache.reminders[ws]=r7.data||[];
}

// ══════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════
function goView(v){
  currentView=v;
  document.getElementById("view-week").style.display=v==="week"?"block":"none";
  document.getElementById("view-day").style.display=v==="day"?"block":"none";
  document.querySelectorAll(".tnav").forEach(n=>n.classList.remove("active"));
  document.getElementById("tnav-"+v).classList.add("active");
  if(v==="day")renderDayView();
}
async function shiftWeek(d){
  currentWeekSat=addDays(currentWeekSat,d*7);
  if(!cache.weeks[currentWeekSat])await loadWeekData(currentWeekSat);
  renderAll();
}
async function shiftDay(d){
  currentDay=addDays(currentDay,d);
  currentWeekSat=getWeekSat(currentDay);
  if(!cache.weeks[currentWeekSat])await loadWeekData(currentWeekSat);
  renderDayView();
}
async function gotoToday(){
  var t=today();
  currentDay=t;
  currentWeekSat=getWeekSat(t);
  if(!cache.weeks[currentWeekSat])await loadWeekData(currentWeekSat);
  renderAll();
}

// ══════════════════════════════════════════════════════════
// RENDER ALL
// ══════════════════════════════════════════════════════════
function renderAll(){
  var ws=currentWeekSat,we=addDays(ws,6);
  var[jys,jms,jds]=g2j(...ws.split("-").map(Number));
  var[jye,jme,jde]=g2j(...we.split("-").map(Number));
  document.getElementById("week-range").textContent=jds+" "+JM[jms-1]+" تا "+jde+" "+JM[jme-1]+" "+jye;
  document.getElementById("tb-week").textContent="هفته "+jds+" "+JM[jms-1];
  // focus
  var wdata=cache.weeks[ws];
  document.getElementById("week-focus").value=wdata?wdata.focus||"":"";
  renderDaysGrid();
  renderHabitsPanel();
  renderWeeklyTasksPanel();
  renderRemindersPanel();
}

// ══════════════════════════════════════════════════════════
// DAYS GRID
// ══════════════════════════════════════════════════════════
function renderDaysGrid(){
  var ws=currentWeekSat,t=today();
  var cols="";
  for(var i=0;i<7;i++){
    var ds=addDays(ws,i);
    var isToday=ds===t;
    var[jy,jm,jd]=g2j(...ds.split("-").map(Number));
    cols+=renderDayCol(ds,i,jd,JM[jm-1],isToday);
  }
  document.getElementById("days-grid").innerHTML=cols;
  // attach listeners after render
  attachDayListeners();
}

function renderDayCol(ds,dayIdx,jd,jmName,isToday){
  var priorities=cache.priorities[ds]||[];
  var events=cache.events[ds]||[];
  var tasks=cache.tasks[ds]||[];
  var done=tasks.filter(t=>t.done).length;
  var pct=tasks.length?Math.round(done/tasks.length*100):0;
  var dayColors=["var(--sat)","var(--sun)","var(--mon)","var(--tue)","var(--wed)","var(--thu)","var(--fri)"];
  var gradColors=["#5b6af0","#f97316","#10b981","#f59e0b","#3b82f6","#8b5cf6","#ec4899"];

  // priorities rows (5 slots)
  var prioHTML="";
  for(var n=1;n<=5;n++){
    var p=priorities.find(x=>x.num===n);
    prioHTML+=`<div class="priority-row">
      <div class="pnum">${n}</div>
      <textarea class="pinput" data-ds="${ds}" data-num="${n}" data-id="${p?p.id:""}" rows="1" placeholder="اولویت ${n}..." onblur="savePriority(this)" oninput="autoResize(this)">${p?esc(p.text||""):""}</textarea>
    </div>`;
  }

  // events rows
  var evHTML=events.map(e=>`
    <div class="event-row" data-eid="${e.id}">
      <input class="etime-input" value="${e.event_time||""}" placeholder="--:--" onblur="saveEvent(this,'time','${e.id}')" style="direction:ltr"/>
      <textarea class="event-input" rows="1" data-id="${e.id}" placeholder="رویداد..." onblur="saveEvent(this,'text','${e.id}')" oninput="autoResize(this)">${esc(e.text||"")}</textarea>
      <button class="task-del" onclick="delEvent('${e.id}','${ds}')">×</button>
    </div>`).join("");

  // tasks rows
  var taskHTML=tasks.map(t=>`
    <div class="task-row" data-tid="${t.id}">
      <div class="tchk ${t.done?"on":""}" onclick="toggleDayTask('${t.id}','${ds}')"></div>
      <textarea class="tinput ${t.done?"done-text":""}" rows="1" data-id="${t.id}" placeholder="وظیفه..." onblur="saveDayTask(this)" oninput="autoResize(this)">${esc(t.text||"")}</textarea>
      <button class="task-del" onclick="delDayTask('${t.id}','${ds}')">×</button>
    </div>`).join("");

  var barColor=pct>=80?gradColors[dayIdx]:pct>=50?"#f59e0b":"#dc2626";

  return`<div class="day-col d${dayIdx} ${isToday?"today-col":""}" id="dcol-${ds}">
    <div class="day-header" onclick="openDay('${ds}')">
      <div class="day-name">${DAYS_FA[dayIdx]}</div>
      <div class="day-date">${jd} ${jmName.slice(0,4)}</div>
    </div>
    <div class="day-body">
      <div class="priorities-section">
        <div class="sec-mini-label">اولویت‌ها</div>
        ${prioHTML}
      </div>
      <div class="events-section">
        <div class="sec-mini-label">اتفاقات مهم</div>
        ${evHTML}
        <button class="add-event-btn" onclick="addEvent('${ds}')">+ رویداد</button>
      </div>
      <div class="tasks-section">
        <div class="sec-mini-label">وظایف</div>
        ${taskHTML}
        <button class="add-task-btn" onclick="addDayTask('${ds}')">+ وظیفه</button>
        ${tasks.length?`<div class="completion-bar"><div class="completion-fill" style="width:${pct}%;background:${barColor}"></div></div>`:""}
      </div>
    </div>
  </div>`;
}

function attachDayListeners(){
  document.querySelectorAll(".pinput,.event-input,.tinput,.week-focus-input").forEach(el=>{
    autoResize(el);
  });
}

function autoResize(el){
  el.style.height="auto";
  el.style.height=el.scrollHeight+"px";
}

// ══════════════════════════════════════════════════════════
// WEEK FOCUS SAVE
// ══════════════════════════════════════════════════════════
async function saveWeekFocus(){
  var ws=currentWeekSat;
  var text=document.getElementById("week-focus").value;
  var wdata=cache.weeks[ws];
  if(wdata){
    if(wdata.focus===text)return;
    await sb.from("weeks").update({focus:text}).eq("id",wdata.id);
    cache.weeks[ws].focus=text;
  } else {
    var{data}=await sb.from("weeks").insert({week_start:ws,focus:text}).select().single();
    cache.weeks[ws]=data;
  }
  toast("ذخیره شد");
}

// ══════════════════════════════════════════════════════════
// PRIORITIES
// ══════════════════════════════════════════════════════════
async function savePriority(el){
  var ds=el.dataset.ds,num=parseInt(el.dataset.num),id=el.dataset.id,text=el.value.trim();
  if(!cache.priorities[ds])cache.priorities[ds]=[];
  if(id){
    var item=cache.priorities[ds].find(p=>p.id===id);
    if(item&&item.text===text)return;
    await sb.from("day_priorities").update({text}).eq("id",id);
    if(item)item.text=text;
  } else {
    if(!text)return;
    var{data}=await sb.from("day_priorities").insert({day_date:ds,num,text}).select().single();
    if(data){cache.priorities[ds].push(data);el.dataset.id=data.id;}
  }
  toast("ذخیره شد");
}

// ══════════════════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════════════════
async function addEvent(ds){
  var{data}=await sb.from("day_events").insert({day_date:ds,event_time:"",text:"",sort_order:(cache.events[ds]||[]).length}).select().single();
  if(data){if(!cache.events[ds])cache.events[ds]=[];cache.events[ds].push(data);}
  reRenderDayCol(ds);
}
async function saveEvent(el,field,id){
  var val=el.value.trim();
  var ev=findEvent(id);
  if(!ev||ev[field]===val)return;
  ev[field]=val;
  await sb.from("day_events").update({[field]:val}).eq("id",id);
}
async function delEvent(id,ds){
  cache.events[ds]=(cache.events[ds]||[]).filter(e=>e.id!==id);
  await sb.from("day_events").delete().eq("id",id);
  reRenderDayCol(ds);toast("حذف شد");
}
function findEvent(id){
  for(var ds in cache.events){var ev=cache.events[ds].find(e=>e.id===id);if(ev)return ev;}
  return null;
}

// ══════════════════════════════════════════════════════════
// DAY TASKS
// ══════════════════════════════════════════════════════════
async function addDayTask(ds){
  var{data}=await sb.from("day_tasks").insert({day_date:ds,text:"",done:false,sort_order:(cache.tasks[ds]||[]).length}).select().single();
  if(data){if(!cache.tasks[ds])cache.tasks[ds]=[];cache.tasks[ds].push(data);}
  reRenderDayCol(ds);
}
async function saveDayTask(el){
  var id=el.dataset.id,text=el.value.trim();
  var t=findDayTask(id);if(!t||t.text===text)return;
  t.text=text;
  await sb.from("day_tasks").update({text}).eq("id",id);
}
async function toggleDayTask(id,ds){
  var t=findDayTask(id);if(!t)return;
  t.done=!t.done;
  await sb.from("day_tasks").update({done:t.done}).eq("id",id);
  reRenderDayCol(ds);
  if(t.done)toast("انجام شد ✓");
}
async function delDayTask(id,ds){
  cache.tasks[ds]=(cache.tasks[ds]||[]).filter(t=>t.id!==id);
  await sb.from("day_tasks").delete().eq("id",id);
  reRenderDayCol(ds);toast("حذف شد");
}
function findDayTask(id){
  for(var ds in cache.tasks){var t=cache.tasks[ds].find(t=>t.id===id);if(t)return t;}
  return null;
}

// ══════════════════════════════════════════════════════════
// RE-RENDER SINGLE DAY COL
// ══════════════════════════════════════════════════════════
function reRenderDayCol(ds){
  var ws=currentWeekSat;
  var dayIdx=Math.round((new Date(ds+"T12:00")-new Date(ws+"T12:00"))/(86400000));
  var[jy,jm,jd]=g2j(...ds.split("-").map(Number));
  var isToday=ds===today();
  var el=document.getElementById("dcol-"+ds);
  if(!el)return;
  var tmp=document.createElement("div");
  tmp.innerHTML=renderDayCol(ds,dayIdx,jd,JM[jm-1],isToday);
  el.replaceWith(tmp.firstElementChild);
  document.querySelectorAll(`#dcol-${ds} .pinput,#dcol-${ds} .event-input,#dcol-${ds} .tinput`).forEach(autoResize);
}

// ══════════════════════════════════════════════════════════
// HABITS PANEL
// ══════════════════════════════════════════════════════════
function renderHabitsPanel(){
  var ws=currentWeekSat;
  var container=document.getElementById("habits-panel");
  if(!cache.habits.length){
    container.innerHTML=`<div style="font-size:11px;color:var(--text3);margin-bottom:.75rem">هنوز عادتی ثبت نشده</div>`;
  } else {
    var thead=`<tr><th></th>${DAYS_SHORT.map(d=>`<th>${d}</th>`).join("")}<th style="min-width:30px">%</th></tr>`;
    var tbody=cache.habits.map(h=>{
      var cells=Array.from({length:7},(_,i)=>{
        var ds=addDays(ws,i);
        var key=h.id+"_"+ds;
        var log=cache.habitLogs[key];
        var done=log&&log.done;
        return`<td><div class="habit-chk ${done?"on":""}" onclick="toggleHabit('${h.id}','${ds}')">${done?"✓":""}</div></td>`;
      }).join("");
      var total=Array.from({length:7},(_,i)=>addDays(ws,i)).filter(ds=>{var k=h.id+"_"+ds;return cache.habitLogs[k]&&cache.habitLogs[k].done;}).length;
      var pct=Math.round(total/7*100);
      return`<tr>
        <td class="habit-name-cell">${esc(h.name)}</td>
        ${cells}
        <td style="font-size:9px;color:var(--text2);font-weight:600">${pct}%</td>
      </tr>`;
    }).join("");
    var totalDone=0,totalPossible=cache.habits.length*7;
    cache.habits.forEach(h=>{Array.from({length:7},(_,i)=>addDays(ws,i)).forEach(ds=>{var k=h.id+"_"+ds;if(cache.habitLogs[k]&&cache.habitLogs[k].done)totalDone++;});});
    var weekPct=totalPossible?Math.round(totalDone/totalPossible*100):0;
    container.innerHTML=`<table class="habits-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>
      <div class="habits-score">انجام هفته: ${totalDone}/${totalPossible} (${weekPct}%)</div>
      <div class="habit-add-row">
        <input class="habit-inp" id="new-habit-inp" placeholder="عادت جدید..." onkeydown="if(event.key==='Enter')addHabit()"/>
        <button class="btn-xs" onclick="addHabit()">+</button>
      </div>`;
  }
}

async function toggleHabit(hid,ds){
  var key=hid+"_"+ds;
  var log=cache.habitLogs[key];
  if(log){
    log.done=!log.done;
    await sb.from("habit_logs").update({done:log.done}).eq("id",log.id);
  } else {
    var{data}=await sb.from("habit_logs").insert({habit_id:hid,log_date:ds,done:true}).select().single();
    if(data)cache.habitLogs[key]={id:data.id,done:true};
  }
  renderHabitsPanel();
}

async function addHabit(){
  var inp=document.getElementById("new-habit-inp");
  var name=inp.value.trim();if(!name)return;
  var{data}=await sb.from("habits").insert({name,sort_order:cache.habits.length}).select().single();
  if(data){cache.habits.push(data);inp.value="";}
  renderHabitsPanel();toast("عادت اضافه شد");
}

// ══════════════════════════════════════════════════════════
// WEEKLY TASKS
// ══════════════════════════════════════════════════════════

async function addWeeklyTask(){

  var{data}=await sb.from("weekly_tasks").insert({week_start:ws,text:"",done:false,sort_order:(cache.weeklyTasks[ws]||[]).length}).select().single();

async function saveWeeklyTask(id,text){

}
async function toggleWeeklyTask(id){

}

// ══════════════════════════════════════════════════════════
// REMINDERS
// ══════════════════════════════════════════════════════════
function renderRemindersPanel(){
  var ws=currentWeekSat;
  var rems=cache.reminders[ws]||[];
  document.getElementById("reminders-panel").innerHTML=rems.map(r=>`
    <div class="reminder-row" data-rid="${r.id}">
      <div class="rem-chk ${r.done?"on":""}" onclick="toggleReminder('${r.id}')">${r.done?"✓":""}</div>
      <input class="rem-inp" value="${esc(r.text||"")}" placeholder="یادآور..." onblur="saveReminder('${r.id}',this.value)"/>
      <button class="rem-del" onclick="delReminder('${r.id}')">×</button>
    </div>`).join("");
}

async function addReminder(){
  var ws=currentWeekSat;
  var{data}=await sb.from("reminders").insert({week_start:ws,text:"",done:false,sort_order:(cache.reminders[ws]||[]).length}).select().single();
  if(data){if(!cache.reminders[ws])cache.reminders[ws]=[];cache.reminders[ws].push(data);}
  renderRemindersPanel();
}
async function saveReminder(id,text){
  var ws=currentWeekSat;
  var r=(cache.reminders[ws]||[]).find(r=>r.id===id);
  if(!r||r.text===text)return;
  r.text=text;
  await sb.from("reminders").update({text}).eq("id",id);
}
async function toggleReminder(id){
  var ws=currentWeekSat;
  var r=(cache.reminders[ws]||[]).find(r=>r.id===id);if(!r)return;
  r.done=!r.done;
  await sb.from("reminders").update({done:r.done}).eq("id",id);
  renderRemindersPanel();
}
async function delReminder(id){
  var ws=currentWeekSat;
  cache.reminders[ws]=(cache.reminders[ws]||[]).filter(r=>r.id!==id);
  await sb.from("reminders").delete().eq("id",id);
  renderRemindersPanel();toast("حذف شد");
}

// ══════════════════════════════════════════════════════════
// DAY DETAIL VIEW
// ══════════════════════════════════════════════════════════
function openDay(ds){
  currentDay=ds;
  goView("day");
}
function renderDayView(){
  var ds=currentDay;
  var[jy,jm,jd]=g2j(...ds.split("-").map(Number));
  var dayIdx=Math.round((new Date(ds+"T12:00")-new Date(getWeekSat(ds)+"T12:00"))/(86400000));
  document.getElementById("day-label").textContent=DAYS_FA[dayIdx]+" "+jd+" "+JM[jm-1]+" "+jy;

  var priorities=cache.priorities[ds]||[];
  var events=cache.events[ds]||[];
  var tasks=cache.tasks[ds]||[];
  var done=tasks.filter(t=>t.done).length;
  var pct=tasks.length?Math.round(done/tasks.length*100):0;
  var dayColors=["var(--sat)","var(--sun)","var(--mon)","var(--tue)","var(--wed)","var(--thu)","var(--fri)"];
  var col=dayColors[dayIdx];

  var prioHTML=Array.from({length:5},(_,i)=>{
    var n=i+1,p=priorities.find(x=>x.num===n);
    return`<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px">
      <div style="width:22px;height:22px;border-radius:50%;background:${col};color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">${n}</div>
      <textarea class="pinput" data-ds="${ds}" data-num="${n}" data-id="${p?p.id:""}" rows="1" style="flex:1;font-size:13px" placeholder="اولویت ${n}..." onblur="savePriority(this)" oninput="autoResize(this)">${p?esc(p.text||""):""}</textarea>
    </div>`;
  }).join("");

  var evHTML=events.map(e=>`
    <div class="event-row" style="margin-bottom:8px;background:var(--bg3);padding:8px 10px;border-radius:8px">
      <input class="etime-input" value="${e.event_time||""}" placeholder="--:--" style="font-size:12px;direction:ltr;width:44px" onblur="saveEvent(this,'time','${e.id}')"/>
      <textarea class="event-input" rows="1" data-id="${e.id}" style="flex:1;font-size:13px" placeholder="رویداد..." onblur="saveEvent(this,'text','${e.id}')" oninput="autoResize(this)">${esc(e.text||"")}</textarea>
      <button class="task-del" style="opacity:1;font-size:14px" onclick="delEvent('${e.id}','${ds}');renderDayView()">×</button>
    </div>`).join("");

  var taskHTML=tasks.map(t=>`
    <div class="task-row" style="margin-bottom:6px;padding:8px 10px;background:var(--bg3);border-radius:8px">
      <div class="tchk ${t.done?"on":""}" style="width:16px;height:16px" onclick="toggleDayTask('${t.id}','${ds}');setTimeout(renderDayView,100)"></div>
      <textarea class="tinput ${t.done?"done-text":""}" rows="1" data-id="${t.id}" style="flex:1;font-size:13px" placeholder="وظیفه..." onblur="saveDayTask(this)" oninput="autoResize(this)">${esc(t.text||"")}</textarea>
      <button class="task-del" style="opacity:1;font-size:14px" onclick="delDayTask('${t.id}','${ds}');setTimeout(renderDayView,100)">×</button>
    </div>`).join("");

  document.getElementById("day-detail").innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--sh)">
        <div style="font-size:12px;font-weight:800;color:${col};margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px">اولویت‌های امروز</div>
        ${prioHTML}
      </div>
      <div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--sh);margin-bottom:1rem">
          <div style="font-size:12px;font-weight:800;color:${col};margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px">اتفاقات مهم</div>
          ${evHTML}
          <button class="add-row-btn" onclick="addEvent('${ds}');setTimeout(renderDayView,200)">+ رویداد جدید</button>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;box-shadow:var(--sh)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <div style="font-size:12px;font-weight:800;color:${col};text-transform:uppercase;letter-spacing:.5px">وظایف</div>
            <div style="font-size:11px;color:var(--text2);font-weight:600">${done}/${tasks.length} (${pct}%)</div>
          </div>
          ${taskHTML}
          <button class="add-row-btn" onclick="addDayTask('${ds}');setTimeout(renderDayView,200)">+ وظیفه جدید</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("#day-detail .pinput,#day-detail .event-input,#day-detail .tinput").forEach(autoResize);
}

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
var _t;
function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(_t);_t=setTimeout(()=>el.classList.remove("show"),2000);}

window.addEventListener("load",()=>{
  var url=localStorage.getItem("pl_url"),key=localStorage.getItem("pl_key");
  if(url&&key){document.getElementById("sb-url").value=url;document.getElementById("sb-key").value=key;initSB();}
});
</script>
